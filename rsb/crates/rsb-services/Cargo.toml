[package]
name = "rsb-services"
description = "Data sources (system, battery, audio, network, media, window, workspaces) and script I/O (exec, files, HTTP), each off the UI thread."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "apps_reader_host"
path = "src/bin/apps_reader_host.rs"
test = false
doc = false

[dependencies]
rsb-core.workspace = true
tungstenite.workspace = true
serde_json.workspace = true
log.workspace = true
windows-core.workspace = true

